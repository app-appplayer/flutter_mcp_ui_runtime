name: flutter_mcp_ui_runtime
description: Runtime for building dynamic Flutter UIs from JSON with lifecycle management, state handling, and MCP protocol support.
version: 0.6.1
homepage: https://app-appplayer.github.io/makemind
repository: https://github.com/app-appplayer/flutter_mcp_ui_runtime
issue_tracker: https://github.com/app-appplayer/flutter_mcp_ui_runtime/issues
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_mcp_ui_core: ^0.5.0
  mcp_bundle: ^0.4.9
  provider: ^6.1.1
  collection: ^1.18.0
  crypto: ^3.0.3
  http: ^1.2.0
  shared_preferences: ^2.2.2
  # v1.1 dependencies
  path: ^1.9.0
  file_picker: ^8.0.0
  watcher: ^1.1.0
  device_info_plus: ^10.0.0
  # Web-only interop, reached solely through conditional imports (pdfViewer,
  # voiceInput). Flutter already carries it transitively; declared because we
  # import it directly. Native builds never compile these files.
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true

topics:
  - ui
  - json
  - mcp
  - flutter
  - runtime